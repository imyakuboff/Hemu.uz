# Har bir push'dan keyin saytni serverda avtomatik yangilaydi.
# Bir marta sozlash: GitHub → Settings → Secrets and variables → Actions → New repository secret
#   SSH_KEY        — serverga kirish uchun maxfiy SSH kalit (tavsiya; bo'lsa parol ishlatilmaydi)
#   SSH_PASSWORD   — kalit bo'lmasa: serverning root paroli
#   ADMIN_LOGIN, ADMIN_PASSWORD — admin panelga kirish (login + parol); parol repoda saqlanmaydi
name: Tashxis

on:
  push:
    branches: [diag]
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # SSH_KEY telefondan nusxalanganda qatorlari qo'shilib ketishi mumkin — kalit qayta tiklanadi.
      # Bitta qatorli base64 ko'rinishda berilsa ham ishlaydi.
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Serverda yangilash
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Gmail: GitHub → Settings → Secrets → SMTP_USER (Gmail manzil) va SMTP_PASS (16 harfli ilova paroli)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          # Kalit to'g'ri bo'lsa parol yuborilmaydi (aks holda parol birinchi sinaladi va kalit ishlatilmaydi)
          password: ${{ env.DEPLOY_KEY == '' && secrets.SSH_PASSWORD || '' }}
          port: 22
          command_timeout: 15m
          envs: SMTP_USER,SMTP_PASS,ADMIN_LOGIN,ADMIN_PASSWORD
          script: |
            R=$(sudo -u hemu node --disable-warning=ExperimentalWarning -e "
              const {DatabaseSync}=require('node:sqlite');const d=new DatabaseSync('/opt/hemu/data/movexgo.db');d.exec('PRAGMA busy_timeout=5000');
              const r=d.prepare(\"UPDATE listings SET status='active', expires_at=datetime('now','+30 days'), bumped_at=datetime('now'), updated_at=datetime('now') WHERE id BETWEEN 17 AND 24 AND status='archived'\").run();
              const a=d.prepare(\"SELECT COUNT(*) n FROM listings WHERE status='active'\").get().n;
              console.log('faollashtirildi='+r.changes+' faol_jami='+a);")
            echo "::notice::$R"
            echo "::notice::Saytda: $(curl -s --max-time 10 'http://127.0.0.1:4710/api/v1/listings?per_page=1' | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log("total="+JSON.parse(d).total)}catch(e){console.log("?")}})')"
