name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save qrcode@1.5.4 >/dev/null 2>&1 && node .github/diag/assets.js
      - run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          cp -r out /tmp/out && git checkout --orphan assets && git rm -rfq . && cp /tmp/out/* . && git add -A && git commit -qm assets && git push -f origin assets
