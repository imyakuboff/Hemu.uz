# /etc/nginx/sites-available/hemu.conf
# Bepul domen: 189-74-98-45.nip.io → 189.74.98.45 (nip.io IP manzilni o'zi qaytaradi)
# Kerak: /etc/nginx/conf.d/hemu-security.conf (limit_req_zone va boshqalar — deploy/nginx-hemu-security.conf)
# HTTPS: certbot --nginx -d 189-74-98-45.nip.io

server {
    server_name 189-74-98-45.nip.io;

    client_max_body_size 160m;   # 15 ta rasm × 10 MB
    # Sekin ulanish hujumlaridan (slowloris) himoya
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;
    # Bitta IP dan bir vaqtda ko'pi bilan 40 ta ulanish
    limit_conn hemu_conn 40;

    # Yashirin fayllar (.env, .git ...) — yopiq (sertifikat yangilash yo'li bundan mustasno)
    location ~ /\.(?!well-known/) { return 404; }
    # Saytda yo'q, lekin hakerlik skanerlari qidiradigan manzillar — javobsiz uziladi
    location ~* \.(php\d?|asp|aspx|jsp|cgi|env|sql|bak|old|ini|log|sh|yml|yaml|config)$ { return 444; }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|wordpress|phpmyadmin|pma|myadmin|xmlrpc|cgi-bin|vendor/phpunit|actuator|server-status|boaform|HNAP1) { return 444; }

    # Real vaqt (SSE): bufersiz va uzoq ulanish; token so'rovda bo'lgani uchun log yozilmaydi
    location /api/v1/stream {
        access_log off;
        proxy_pass http://127.0.0.1:4710;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Kirish, SMS-kod, parol: daqiqasiga 10 ta so'rov (+10 zaxira) — parol terish hujumlariga qarshi
    location /api/v1/auth/ {
        limit_req zone=hemu_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: soniyasiga 20 ta so'rov (+60 zaxira) bitta IP dan
    location /api/ {
        limit_req zone=hemu_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=hemu_web burst=100 nodelay;
        proxy_pass http://127.0.0.1:4710;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/189-74-98-45.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/189-74-98-45.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = 189-74-98-45.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name 189-74-98-45.nip.io;
    return 404; # managed by Certbot
}
