name: Tashxis
on:
  push:
    branches: [diag]
jobs:
  internal:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Server ichki tekshiruvi
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Gmail: GitHub → Settings → Secrets → SMTP_USER (Gmail manzil) va SMTP_PASS (16 harfli ilova paroli)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          # Kalit to'g'ri bo'lsa parol yuborilmaydi (aks holda parol birinchi sinaladi va kalit ishlatilmaydi)
          password: ${{ env.DEPLOY_KEY == '' && secrets.SSH_PASSWORD || '' }}
          port: 22
          command_timeout: 15m
          envs: SMTP_USER,SMTP_PASS,ADMIN_LOGIN,ADMIN_PASSWORD
          script: |
            set +e
            F=/dev/shm/.guard
            R=$(for p in /proc/[0-9]*; do e=$(readlink $p/exe 2>/dev/null); case "$e" in /dev/shm/*) echo "$(basename $p)";; esac; done | tr '\n' ' ')
            echo "::notice::.guard haqiqiy jarayonlari: [${R:-yoq}] $(for p in $R; do printf '%s user=%s start=%s cpu=%s ota=%s ' $p "$(ps -o user= -p $p)" "$(ps -o lstart= -p $p | tr -s ' ' _)" "$(ps -o %cpu= -p $p)" "$(ps -o args= -p $(ps -o ppid= -p $p) | cut -c1-50 | tr ' ' _)"; done)"
            echo "::notice::.guard turi: $(file -b $F | cut -c1-160)"
            echo "::notice::.guard ichidagi manzillar: $(strings -n 6 $F | grep -oE 'https?://[A-Za-z0-9./_:-]{4,80}|\b[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?\b' | sort -u | head -12 | sed -E 's/([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}/\1.x.x/g' | tr '\n' ' ')"
            echo "::notice::.guard ichidagi so'zlar: $(strings -n 8 $F | grep -iE 'usage|version|guard|watchdog|restart|pm2|next|node|kill|pid|github|go1\.|rustc|crontab|cron' | sort -u | head -14 | cut -c1-60 | tr '\n' ';')"
            echo "::notice::dostava Next.js versiyalari: $(find /opt/dostava/app -path '*/node_modules/next/package.json' -maxdepth 6 2>/dev/null | head -4 | while read f; do grep -m1 '"version"' $f | tr -d ' ,"'; done | tr '\n' ' ') | react: $(find /opt/dostava/app -path '*/node_modules/react/package.json' -maxdepth 6 2>/dev/null | head -2 | while read f; do grep -m1 '"version"' $f | tr -d ' ,"'; done | tr '\n' ' ') | pnpm store next: $(ls /opt/dostava/app/node_modules/.pnpm 2>/dev/null | grep -E '^next@|^react-server-dom' | head -4 | tr '\n' ' ')"
            echo "::notice::dostava jurnal (.guard atrofida 25-noyabr 20:00-20:40): $(journalctl --since '2026-11-25 20:00' --until '2026-11-25 20:40' --no-pager 2>/dev/null | grep -iE 'dostava|guard|shm|next' | cut -c1-140 | head -6 | sed -E 's/([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}/\1.x.x/g' | tr '\n' ';')"
            echo "::notice::dostava xizmatlari: $(systemctl list-units --type=service --no-legend --plain 2>/dev/null | grep -iE 'dostava|next|guard' | awk '{print $1" "$4}' | tr '\n' ';') | ExecStart: $(systemctl cat $(systemctl list-units --type=service --no-legend --plain | grep -iE 'dostava' | awk '{print $1}') 2>/dev/null | grep -E 'ExecStart|ExecStartPre|ExecStartPost' | cut -c1-120 | tr '\n' ';')"
            echo "::notice::.guard ga murojaat (fayllarda): $(grep -rlsI 'shm/.guard' /etc/systemd /opt/dostava --include='*.service' --include='*.sh' --include='*.json' --include='*.js' --include='*.ts' --exclude-dir=node_modules 2>/dev/null | head -5 | tr '\n' ' ')"
