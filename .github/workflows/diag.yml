name: Tashxis
on:
  push:
    branches: [diag]
jobs:
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/diag/external.sh
  internal:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Server ichki tekshiruvi
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Gmail: GitHub → Settings → Secrets → SMTP_USER (Gmail manzil) va SMTP_PASS (16 harfli ilova paroli)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          # Kalit to'g'ri bo'lsa parol yuborilmaydi (aks holda parol birinchi sinaladi va kalit ishlatilmaydi)
          password: ${{ env.DEPLOY_KEY == '' && secrets.SSH_PASSWORD || '' }}
          port: 22
          command_timeout: 15m
          envs: SMTP_USER,SMTP_PASS,ADMIN_LOGIN,ADMIN_PASSWORD
          script: |
            set +e
            for f in /dev/shm/.guard /tmp/pc.sh /tmp/pc_bg.sh /tmp/relogin.sh /tmp/watch.sh; do
              [ -f "$f" ] || continue
              K=$(grep -ciE 'xmrig|miner|stratum|base64 -d|/dev/tcp|nc -e|bash -i|curl[^|]*\| *(ba)?sh|wget[^|]*\| *(ba)?sh|chattr|authorized_keys|crontab|useradd|passwd' "$f" 2>/dev/null)
              echo "::notice::$f: egasi=$(stat -c %U "$f") hajm=$(stat -c %s "$f") tur=$(file -b "$f" | cut -c1-40) sana=$(stat -c %y "$f" | cut -c1-16) xavfli_belgilar=$K | ishlayaptimi=$(pgrep -fc "$(basename $f)") | 1-qator: $(head -c 300 "$f" | head -1 | tr -cd '[:print:]' | cut -c1-80) | buyruqlar: $(grep -oE '\b(curl|wget|ssh|scp|kill|pkill|systemctl|docker|npm|node|python3?|adb|emulator|gradle|xdotool|chromium|google-chrome|sleep|nohup)\b' "$f" 2>/dev/null | sort | uniq -c | sort -rn | head -6 | tr -s ' ' | tr '\n' ',')"
            done
            echo "::notice::dostava jarayonlari: $(ps -u dostava -o pid=,etime=,args= 2>/dev/null | cut -c1-90 | tr '\n' ';')"
            echo "::notice::Chiquvchi ulanishlar (g'ayrioddiy portlar): $(ss -tnpH state established 2>/dev/null | awk '{print $4" "$5" "$6}' | grep -vE ':(22|80|443|5432|4710|3100|8000|8790|8791|4100) ' | awk '{split($2,a,":"); split(a[1],o,"."); print o[1]"."o[2]".x.x:"a[2]" "gensub(/.*\(\("([^"]+)".*/,"\\1",1,$3)}' | sort | uniq -c | head -10 | tr -s ' ' | tr '\n' ';')"
            echo "::notice::hemu-scan jail: $(fail2ban-client get hemu-scan maxretry 2>/dev/null)/$(fail2ban-client get hemu-scan findtime 2>/dev/null)s ban=$(fail2ban-client get hemu-scan bantime 2>/dev/null)s | hemu login limiti: $(grep -E 'loginLimit|LOGIN_LIMIT|rateLimit\(.*login' -r /opt/hemu/src 2>/dev/null | head -2 | cut -c1-120 | tr '\n' ';')"
