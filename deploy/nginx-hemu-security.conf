# /etc/nginx/conf.d/hemu-security.conf — http darajasidagi sozlamalar (faqat HEMU server bloki ishlatadi)
server_tokens off;   # javobda nginx versiyasi ko'rsatilmaydi

limit_req_zone $binary_remote_addr zone=hemu_web:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hemu_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hemu_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=hemu_conn:10m;
limit_req_status 429;
limit_conn_status 429;
