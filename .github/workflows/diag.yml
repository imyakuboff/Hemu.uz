name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  viz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/diag/viz.js
      - run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          mkdir -p /tmp/s && cp *.png /tmp/s/; git checkout --orphan shots && git rm -rfq . && cp /tmp/s/* . && git add -A && git commit -qm shots && git push -f origin shots
