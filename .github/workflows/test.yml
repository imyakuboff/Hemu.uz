# Har push'da avtomatik testlar (npm test)
name: Testlar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log && exit 0
          # Xatolar GitHub'da "Annotations" bo'limida ko'rinishi uchun
          grep -nE "^\s*not ok|error:|expected:|actual:|AssertionError|Error:|at .*test/" /tmp/test.log | grep -v "^\s*$" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E "^# (tests|pass|fail)" /tmp/test.log | while IFS= read -r l; do echo "::notice::$l"; done
          exit 1
