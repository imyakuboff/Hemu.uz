name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: read
jobs:
  holat:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Server holati (faqat o'qish)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          script: |
            n(){ echo "::notice::$*"; }
            cd /opt/hemu
            for k in TELEGRAM_BOT_TOKEN SMS_PROVIDER ESKIZ_EMAIL SMTP_USER ADMIN_TWO_FACTOR SESSION_TTL_DAYS NODE_ENV; do v=$(grep -E "^$k=" .env | cut -d= -f2-); n "env $k: $([ -n "$v" ] && ([ "$k" = SMS_PROVIDER ] || [ "$k" = NODE_ENV ] || [ "$k" = SESSION_TTL_DAYS ] && echo "$v" || echo bor) || echo yoq)"; done
            DBF=$(grep -E '^DB_FILE=' .env | cut -d= -f2 | tr -d '"\r '); DBF=${DBF:-data/movexgo.db}
            Q(){ sqlite3 -readonly "$DBF" "$1" 2>&1; }
            command -v sqlite3 >/dev/null || { n "sqlite3 yo'q"; exit 0; }
            n "sozlamalar: $(Q "select group_concat(key||'='||case when key like '%pass%' or key like '%token%' or key like '%secret%' or key like '%key%' then 'bor' else value end, '; ') from settings where key in ('adminTwoFactor','smsProvider','backupTelegram','otpDevEcho','otpTestRegistration','mailProvider') or key like 'eskiz.%'")"
            n "xodimlar: $(Q "select group_concat(id||':'||coalesce(username,'-')||':'||role||':blok='||blocked||':parol='||coalesce(substr(password_set_at,1,10),'?')||':tg='||(select count(*) from telegram_links t where t.user_id=users.id), ' | ') from users where role in ('admin','moderator')")"
            n "admin sessiyalar: $(Q "select count(*)||' ta, eng eski: '||min(substr(created_at,1,10)) from sessions s join users u on u.id=s.user_id where u.role in ('admin','moderator') and s.expires_at > datetime('now')")"
            n "admin sessiya IP lar: $(Q "select group_concat(distinct substr(ip,1,instr(ip||'.', '.')-1)||'.x.x.x') from sessions s join users u on u.id=s.user_id where u.role in ('admin','moderator') and s.expires_at > datetime('now')")"
            n "impersonate (30 kun): $(Q "select count(*) from admin_log where action='user.impersonate' and created_at > datetime('now','-30 day')")"
            n "admin_log oxirgi: $(Q "select group_concat(a, ' | ') from (select substr(created_at,6,11)||' '||action as a from admin_log order by id desc limit 8)")"
            n "rol o'zgarishlari: $(Q "select group_concat(substr(created_at,1,10)||' '||action||' '||coalesce(details,''), ' | ') from admin_log where action like '%role%' or details like '%admin%'" | cut -c1-300)"
            n "telegram linklar jami: $(Q "select count(*) from telegram_links")"
