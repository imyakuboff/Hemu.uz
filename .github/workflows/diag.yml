    branches: [diag]
permissions:
  contents: read
jobs:
  qidiruv:
    runs-on: ubuntu-latest
    steps:
      - name: Haqiqiy saytda qidiruv
        run: |
          for q in ekskavator экскаватор yuklagich погрузчик pogruzchik zapchast запчасть ehtiyot ijara аренда Toshkent Ташкент XGMA хгма filtr фильтр; do
            n=$(curl -s "https://hemu.uz/api/v1/listings?q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")&per_page=1" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('total',len(d.get('items',[]))))")
            echo "::notice::$q: $n ta"
          done
