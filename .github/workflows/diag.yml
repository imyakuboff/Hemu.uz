name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: read
jobs:
  prod:
    runs-on: ubuntu-latest
    steps:
      - name: Haqiqiy saytda — soxta IP bilan cheklovni aylanib o'tish
        run: |
          n(){ echo "::notice::$*"; }
          B=https://hemu.uz
          sleep 20
          n "sayt: $(curl -s -o /dev/null -w '%{http_code}' $B/) health: $(curl -s $B/health | head -c 80)"
          codes=""; for i in $(seq 36); do codes="$codes $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "X-Forwarded-For: 10.$i.$i.$i" -H "X-Real-IP: 10.$i.$i.$i" -d '{"login":"probe_xff_user","password":"Wrong1234x"}' $B/api/v1/auth/login)"; done
          n "soxta XFF bilan 36 urinish: $(echo $codes | tr ' ' '\n' | sort | uniq -c | tr '\n' ' ')"
          n "admin API tokensiz: $(curl -s -o /dev/null -w '%{http_code}' $B/api/v1/admin/users)"
          n "admin OTP (soxta raqam): $(curl -s -X POST -H 'Content-Type: application/json' -d '{"phone":"+998901112299","code":"000000"}' $B/api/v1/auth/otp/verify | head -c 120)"
