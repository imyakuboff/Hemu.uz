name: Tashxis
on:
  push:
    branches: [diag]
jobs:
  internal:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Server ichki tekshiruvi
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Gmail: GitHub → Settings → Secrets → SMTP_USER (Gmail manzil) va SMTP_PASS (16 harfli ilova paroli)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          # Kalit to'g'ri bo'lsa parol yuborilmaydi (aks holda parol birinchi sinaladi va kalit ishlatilmaydi)
          password: ${{ env.DEPLOY_KEY == '' && secrets.SSH_PASSWORD || '' }}
          port: 22
          command_timeout: 15m
          envs: SMTP_USER,SMTP_PASS,ADMIN_LOGIN,ADMIN_PASSWORD
          script: |
            set +e
            echo "::notice::SSH kirishlar (24s) kalit va manba bo'yicha: $(journalctl -u ssh -u sshd --since '-24h' --no-pager 2>/dev/null | grep Accepted | awk '{for(i=1;i<=NF;i++){if($i=="from")ip=$(i+1); if($i ~ /^SHA256:/)fp=substr($i,1,18)} split(ip,o,"."); print o[1]"."o[2]".x.x "fp}' | sort | uniq -c | sort -rn | head -8 | tr -s ' ' | tr '\n' ';')"
            echo "::notice::root kalitlari (izoh): $(awk '{print $NF}' /root/.ssh/authorized_keys | tr '\n' ' ') | barmoq izlari: $(ssh-keygen -lf /root/.ssh/authorized_keys 2>/dev/null | awk '{print substr($2,1,18)}' | tr '\n' ' ')"
            echo "::notice::Hozir ulangan: $(who | awk '{print $1}' | sort | uniq -c | tr -s ' ' | tr '\n' ';') | sshd jarayonlar: $(pgrep -c sshd)"
            echo "::notice::Disk eng kattalar: $(du -xsh /opt/* /var/* /root /home/* /tmp /usr 2>/dev/null | sort -rh | head -12 | awk '{print $2"="$1}' | tr '\n' ' ')"
            echo "::notice::/opt ichida: $(du -xsh /opt/*/* 2>/dev/null | sort -rh | head -10 | awk '{print $2"="$1}' | tr '\n' ' ')"
            echo "::notice::Jurnal va kesh: journal=$(journalctl --disk-usage 2>/dev/null | grep -oE '[0-9.]+[MG]') apt=$(du -sh /var/cache/apt 2>/dev/null | cut -f1) npm-root=$(du -sh /root/.npm 2>/dev/null | cut -f1) gradle=$(du -sh /root/.gradle 2>/dev/null | cut -f1) snap=$(du -sh /var/lib/snapd 2>/dev/null | cut -f1) hemu-backups=$(du -sh /root/hemu-backups 2>/dev/null | cut -f1) | katta fayllar: $(find / -xdev -type f -size +300M 2>/dev/null | head -8 | xargs -r du -h | awk '{print $2"="$1}' | tr '\n' ' ')"
            echo "::notice::/tmp ijro: $(find /tmp /var/tmp /dev/shm -type f -perm -u+x 2>/dev/null | xargs -r ls -la --time-style=+%m-%d | awk '{print $3,$6,$7}' | tr '\n' ';')"
            echo "::notice::hemu npm audit: $(cd /opt/hemu && sudo -u hemu npm audit --omit=dev --json 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const v=JSON.parse(d).vulnerabilities;console.log(Object.entries(v).map(([k,x])=>k+":"+x.severity+(x.fixAvailable?":fix":"")).join(" "))}catch{console.log("?")}})')"
            echo "::notice::Port 4100 kimniki: $(ss -ltnpH 'sport = :4100' | grep -o 'pid=[0-9]*' | head -1 | cut -d= -f2 | xargs -r ps -o user=,args= -p | cut -c1-80) | ufw qoidalari: $(ufw status 2>/dev/null | grep -E 'ALLOW|DENY' | awk '{print $1"/"$2}' | tr '\n' ' ')"
            echo "::notice::Xavfsizlik yangilanishlari: $(apt list --upgradable 2>/dev/null | grep -i security | cut -d/ -f1 | head -13 | tr '\n' ' ')"
