name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cd app && npm install --save qrcode-generator@1.4.4 --no-audit --no-fund 2>&1 | tail -2
          node -e "const q=require('qrcode-generator');const x=q(0,'M');x.addData('https://hemu.uz/u/test');x.make();console.log('::notice::qr ok', x.getModuleCount())"
          git config user.name Claude; git config user.email noreply@anthropic.com
          git checkout -b deps-qr && git add package.json package-lock.json && git commit -qm "deps: qrcode-generator (vizitka QR kodi uchun)

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01BLSQyzmHR52muy5xKJLBuo" && git push -f origin deps-qr
          git show --stat HEAD | tail -4 | sed 's/^/::notice::/'
