name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  film:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node .github/diag/film.js
      - run: |
          mkdir -p out
          for d in film/*/; do s=$(basename $d); ffmpeg -loglevel error -y -framerate 30 -i "$d/%05d.jpg" -vf "scale=780:1688:flags=lanczos,format=yuv420p" -c:v libx264 -crf 16 -preset slow -pix_fmt yuv420p "out/$s.mp4"; done
          ls -la out
          git config user.name Claude; git config user.email noreply@anthropic.com
          git checkout --orphan media && git rm -rfq . && cp out/*.mp4 . && git add *.mp4 && git commit -qm "Saytdan yozib olingan sahnalar" && git push -f origin media
