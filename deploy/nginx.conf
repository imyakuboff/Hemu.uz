# /etc/nginx/sites-available/hemu  (HTTPS uchun: certbot --nginx -d hemu.uz)
server {
    listen 80;
    server_name hemu.uz www.hemu.uz;

    client_max_body_size 160m;   # 15 ta rasm × 10 MB

    # Real vaqt (SSE): bufersiz va uzoq ulanish
    location /api/v1/stream {
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
