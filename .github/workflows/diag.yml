name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/diag/photos.js
      - run: |
          git config user.name Claude; git config user.email noreply@anthropic.com
          cp -r out /tmp/out && git checkout --orphan photos && git rm -rfq . && cp /tmp/out/* . && git add -A && git commit -qm photos && git push -f origin photos
