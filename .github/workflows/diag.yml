name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: read
jobs:
  holat:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Server holati (faqat o'qish)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          script: |
            n(){ echo "::notice::$*"; }
            cd /opt/hemu
            for k in TELEGRAM_BOT_TOKEN SMS_PROVIDER ESKIZ_EMAIL SMTP_USER ADMIN_TWO_FACTOR SESSION_TTL_DAYS NODE_ENV; do v=$(grep -E "^$k=" .env | cut -d= -f2-); n "env $k: $([ -n "$v" ] && ([ "$k" = SMS_PROVIDER ] || [ "$k" = NODE_ENV ] || [ "$k" = SESSION_TTL_DAYS ] && echo "$v" || echo bor) || echo yoq)"; done
            DBF=$(grep -E '^DB_FILE=' .env | cut -d= -f2 | tr -d '"\r '); DBF=${DBF:-data/movexgo.db}
            Q(){ sqlite3 -readonly "$DBF" "$1" 2>&1; }
            cat > /tmp/q.js <<'JS'
            const { DatabaseSync } = require('node:sqlite');
            const db = new DatabaseSync(process.argv[2], { readOnly: true });
            const n = (s) => console.log('::notice::' + s);
            const all = (q) => db.prepare(q).all();
            const mask = (p) => p ? p.slice(0, 6) + '***' + p.slice(-2) : '-';
            n('sozlamalar: ' + all(`select key, value from settings where key in ('adminTwoFactor','smsProvider','backupTelegram','otpDevEcho','otpTestRegistration','mailProvider')`).map((r) => r.key + '=' + r.value).join('; '));
            for (const u of all(`select id, username, phone, role, blocked, password_set_at, created_at from users where role in ('admin','moderator')`))
              n(`xodim #${u.id} ${u.username || '-'} ${u.role} tel=${mask(u.phone)} test_raqam=${u.phone === '+998901234567'} blok=${u.blocked} parol=${(u.password_set_at || '?').slice(0, 10)} tg=${all('select count(*) c from telegram_links where user_id=' + u.id)[0].c}`);
            n('admin sessiyalar: ' + JSON.stringify(all(`select count(*) c, min(substr(s.created_at,1,10)) eski from sessions s join users u on u.id=s.user_id where u.role in ('admin','moderator') and s.expires_at > datetime('now')`)[0]));
            n('sessiya IP: ' + all(`select distinct s.ip from sessions s join users u on u.id=s.user_id where u.role in ('admin','moderator') and s.expires_at > datetime('now')`).map((r) => String(r.ip).split('.').slice(0, 2).join('.') + '.x.x').join(' '));
            n('admin_log oxirgi: ' + all(`select substr(created_at,6,11) t, action from admin_log order by id desc limit 10`).map((r) => r.t + ' ' + r.action).join(' | '));
            n('impersonate 30 kun: ' + all(`select count(*) c from admin_log where action='user.impersonate' and created_at > datetime('now','-30 day')`)[0].c);
            n('rol berish: ' + all(`select substr(created_at,1,10) t, action, details from admin_log where details like '%role%' order by id desc limit 5`).map((r) => r.t + ' ' + r.action + ' ' + String(r.details).slice(0, 80)).join(' | '));
            JS
            node /tmp/q.js "$DBF" 2>&1 | grep -v ExperimentalWarning | head -30; rm -f /tmp/q.js
