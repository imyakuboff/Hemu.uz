name: Tashxis
on:
  push:
    branches: [diag]
jobs:
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q nmap >/dev/null 2>&1; bash .github/diag/external.sh
  internal:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Server ichki tekshiruvi
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Gmail: GitHub → Settings → Secrets → SMTP_USER (Gmail manzil) va SMTP_PASS (16 harfli ilova paroli)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          # Kalit to'g'ri bo'lsa parol yuborilmaydi (aks holda parol birinchi sinaladi va kalit ishlatilmaydi)
          password: ${{ env.DEPLOY_KEY == '' && secrets.SSH_PASSWORD || '' }}
          port: 22
          command_timeout: 15m
          envs: SMTP_USER,SMTP_PASS,ADMIN_LOGIN,ADMIN_PASSWORD
          script: |
            set +e
            m() { sed -E 's/([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}/\1.x.x/g'; }
            echo "::notice::OS: $(. /etc/os-release; echo $PRETTY_NAME) | kernel $(uname -r) | uptime $(uptime -p)"
            echo "::notice::Yangilanishlar: kutilayotgan=$(apt list --upgradable 2>/dev/null | grep -c upgradable) xavfsizlik=$(apt list --upgradable 2>/dev/null | grep -ci security) | avto-yangilanish=$(systemctl is-enabled unattended-upgrades 2>&1) | qayta yuklash kerak=$([ -f /var/run/reboot-required ] && echo HA || echo yoq)"
            echo "::notice::Firewall: ufw=$(ufw status 2>/dev/null | head -1) | iptables INPUT policy=$(iptables -S INPUT 2>/dev/null | head -1) qoidalar=$(iptables -S INPUT 2>/dev/null | wc -l) | nft=$(nft list ruleset 2>/dev/null | grep -c 'drop\|reject')"
            echo "::notice::Ochiq portlar (barcha interfeyslarda): $(ss -ltnpH 2>/dev/null | awk '{split($4,a,":"); host=substr($4,1,length($4)-length(a[length(a)])-1); if (host!="127.0.0.1" && host!="[::1]" && host!="127.0.0.53%lo" && host!="127.0.0.54") print $4"("gensub(/.*\(\("([^"]+)".*/,"\\1",1,$6)")"}' | tr '\n' ' ')"
            echo "::notice::Faqat localhost: $(ss -ltnpH 2>/dev/null | awk '{print $4}' | grep -E '^(127|\[::1\])' | tr '\n' ' ')"
            echo "::notice::UDP: $(ss -lunpH 2>/dev/null | awk '{print $4}' | grep -vE '^(127|\[::1\])' | tr '\n' ' ')"
            echo "::notice::SSH: $(sshd -T 2>/dev/null | grep -E '^(port|permitrootlogin|passwordauthentication|kbdinteractiveauthentication|pubkeyauthentication|maxauthtries|x11forwarding|permitemptypasswords) ' | tr '\n' ' ') | kalitlar root=$(grep -c '^ssh-\|^ecdsa' /root/.ssh/authorized_keys 2>/dev/null)"
            echo "::notice::fail2ban: $(systemctl is-active fail2ban 2>&1) jails=[$(fail2ban-client status 2>/dev/null | sed -n 's/.*Jail list:\s*//p')] sshd bloklangan=$(fail2ban-client status sshd 2>/dev/null | sed -n 's/.*Currently banned:\s*//p') jami=$(fail2ban-client status sshd 2>/dev/null | sed -n 's/.*Total banned:\s*//p')"
            echo "::notice::SSH urinishlar (24 soat): muvaffaqiyatsiz=$(journalctl -u ssh -u sshd --since '-24h' --no-pager 2>/dev/null | grep -cE 'Failed|Invalid user') muvaffaqiyatli=$(journalctl -u ssh -u sshd --since '-24h' --no-pager 2>/dev/null | grep -c Accepted)"
            echo "::notice::Login qila oladigan foydalanuvchilar: $(awk -F: '$7 !~ /(nologin|false|sync|halt|shutdown)$/ {print $1}' /etc/passwd | tr '\n' ' ') | UID0: $(awk -F: '$3==0{print $1}' /etc/passwd | tr '\n' ' ') | sudo: $(getent group sudo | cut -d: -f4)"
            echo "::notice::Xizmatlar foydalanuvchisi: $(ps -eo user:12,comm:18,args --no-headers | grep -E 'node|python|uvicorn|next|gunicorn|java|php' | grep -v grep | awk '{print $1":"$2}' | sort -u | tr '\n' ' ')"
            echo "::notice::hemu xizmati: $(systemctl show hemu -p User -p NoNewPrivileges -p ProtectSystem -p ProtectHome -p PrivateTmp 2>/dev/null | tr '\n' ' ') | .env=$(stat -c '%a %U' /opt/hemu/.env 2>/dev/null) | baza=$(stat -c '%a %U' /opt/hemu/data/movexgo.db 2>/dev/null) | data=$(stat -c '%a %U' /opt/hemu/data 2>/dev/null)"
            echo "::notice::Boshqa loyihalar .env: $(for f in /opt/*/.env /opt/*/*/.env; do [ -f "$f" ] && printf '%s=%s ' "$f" "$(stat -c '%a:%U' $f)"; done)"
            echo "::notice::Boshqa loyihalar egasi: $(for d in /opt/*/; do printf '%s=%s ' "$(basename $d)" "$(stat -c %U $d)"; done) | root ishlovchi web: $(ps -eo user,args --no-headers | awk '$1=="root"' | grep -E 'node|python|uvicorn|next' | grep -v grep | awk '{print $2,$3}' | cut -c1-60 | tr '\n' ';')"
            echo "::notice::Docker: $(docker ps --format '{{.Names}} {{.Ports}}' 2>/dev/null | tr '\n' ';' || echo yoq)"
            echo "::notice::nginx: $(nginx -v 2>&1) | server_tokens=$(nginx -T 2>/dev/null | grep -m1 -o 'server_tokens [a-z]*') | saytlar: $(nginx -T 2>/dev/null | grep -oE 'server_name [^;]+' | sort -u | tr '\n' '|') | default_server: $(nginx -T 2>/dev/null | grep -c default_server)"
            echo "::notice::SSL: $(for c in /etc/letsencrypt/live/*/cert.pem; do printf '%s tugaydi %s; ' "$(basename $(dirname $c))" "$(openssl x509 -enddate -noout -in $c | cut -d= -f2)"; done) | certbot timer=$(systemctl is-active certbot.timer 2>&1)"
            echo "::notice::Node: $(node -v) | npm audit hemu: $(cd /opt/hemu && sudo -u hemu npm audit --omit=dev --json 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const v=JSON.parse(d).metadata.vulnerabilities;console.log(JSON.stringify(v))}catch{console.log("?")}})')"
            echo "::notice::Cron: $(ls /etc/cron.d | tr '\n' ' ') | root crontab: $(crontab -l 2>/dev/null | grep -vc '^#')"
            echo "::notice::Zaxiralar: $(ls /root/hemu-backups/*.gz /root/hemu-backups/daily/* 2>/dev/null | wc -l) fayl, oxirgisi $(ls -t /root/hemu-backups/db-*.gz /root/hemu-backups/daily/* 2>/dev/null | head -1 | xargs -r stat -c %y | cut -c1-16) | serverdan tashqarida: yoq"
            echo "::notice::Disk: $(df -h / | awk 'NR==2{print $4" free, "$5" band"}') | RAM: $(free -m | awk '/Mem/{print $7"MB free"}') | swap: $(free -m | awk '/Swap/{print $2"MB"}')"
            echo "::notice::Shubhali: /tmp ijro fayllar=$(find /tmp /var/tmp /dev/shm -type f -perm -u+x 2>/dev/null | wc -l) | yangi SUID (30 kun)=$(find / -xdev -perm -4000 -mtime -30 2>/dev/null | wc -l) | yuklama=$(cat /proc/loadavg | cut -d' ' -f1-3) | eng ko'p CPU: $(ps -eo comm,%cpu --sort=-%cpu --no-headers | head -3 | tr -s ' ' | tr '\n' ';')"
