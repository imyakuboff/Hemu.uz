name: Tashxis
on:
  push:
    branches: [diag]
permissions:
  contents: read
jobs:
  sayt:
    runs-on: ubuntu-latest
    steps:
      - name: Tashqaridan tekshirish
        run: |
          for u in http://hemu.uz https://hemu.uz https://www.hemu.uz http://www.hemu.uz https://hemu.uz/api/v1/meta; do
            r=$(curl -sS -o /dev/null -m 15 -w "%{http_code} %{time_total}s -> %{redirect_url}" "$u" 2>&1 | tail -1)
            echo "::notice::$u : $r"
          done
          echo "::notice::DNS hemu.uz: $(dig +short hemu.uz A | sed -E 's/[0-9]+\.[0-9]+$/x.x/' | tr '\n' ' ') | www: $(dig +short www.hemu.uz | sed -E 's/[0-9]+\.[0-9]+$/x.x/' | tr '\n' ' ')"
          echo | openssl s_client -connect hemu.uz:443 -servername hemu.uz 2>/dev/null | openssl x509 -noout -dates -subject 2>&1 | sed 's/^/::notice::cert /'
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Server ichidan
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          port: 22
          script: |
            n(){ echo "::notice::$*"; }
            n "disk: $(df -h / | tail -1 | awk '{print $3"/"$2" band="$5" bosh="$4}')"
            du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -12 | sed 's/^/::notice::root /'
            for d in /root /home /opt /var /srv /usr/local; do du -xh --max-depth=2 $d 2>/dev/null | sort -rh | head -12 | sed "s|^|::notice::$d |"; done
            n "journal: $(journalctl --disk-usage 2>&1)"
            n "docker: $(command -v docker >/dev/null && docker system df 2>&1 | tr '\n' ' ' || echo yoq)"
            n "pm2/services: $(systemctl list-units --type=service --state=running --no-legend | awk '{print $1}' | grep -vE '^(systemd|dbus|cron|ssh|rsyslog|getty|serial|polkit|udisks|unattended|snapd|multipathd|networkd|fail2ban|ufw|user@|irqbalance|ModemManager|qemu|chrony|atd)' | tr '\n' ' ')"
            n "dostava units: $(systemctl list-unit-files 2>/dev/null | grep -i dostava | tr -s ' ' | tr '\n' ';')"
            n "nginx sites: $(ls /etc/nginx/sites-enabled | tr '\n' ' ')"
            for f in /etc/nginx/sites-enabled/*; do n "site $(basename $f): $(grep -hoE 'server_name [^;]+|root [^;]+|proxy_pass [^;]+' $f | sort -u | sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/x.x.x.x/g' | tr '\n' ';' | cut -c1-300)"; done
            ls -la /root/quarantine 2>/dev/null | tail -3 | sed 's/^/::notice::quar /'
            find / -xdev -type f -size +300M 2>/dev/null -exec du -h {} + | sort -rh | head -15 | sed 's/^/::notice::bigfile /'
