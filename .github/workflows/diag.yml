name: Tashxis
on:
  push:
    branches: [diag]
jobs:
  internal:
    runs-on: ubuntu-latest
    steps:
      - name: SSH kalitini tayyorlash
        env:
          RAW_KEY: ${{ secrets.SSH_KEY }}
        run: |
          [ -n "$RAW_KEY" ] || { echo "SSH_KEY yo'q"; exit 0; }
          K=$(printf '%s' "$RAW_KEY" | tr -d '\r')
          if ! printf '%s' "$K" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then K=$(printf '%s' "$K" | tr -d ' \n\t' | base64 -d 2>/dev/null || true); fi
          BODY=$(printf '%s' "$K" | sed -e 's/.*-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----.*//' | tr -d ' \n\t\r')
          [ -n "$BODY" ] || { echo "::warning::SSH_KEY o'qilmadi"; exit 0; }
          FIXED=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----\n' "$(printf '%s' "$BODY" | fold -w 70)")
          printf '%s\n' "$FIXED" > /tmp/k && chmod 600 /tmp/k
          if ssh-keygen -y -f /tmp/k >/tmp/k.pub 2>/tmp/k.err; then echo "Kalit to'g'ri: $(cut -c1-40 /tmp/k.pub)…"; else echo "::warning::SSH_KEY buzilgan: $(cat /tmp/k.err)"; rm -f /tmp/k; exit 0; fi
          rm -f /tmp/k /tmp/k.pub
          { echo 'DEPLOY_KEY<<KEYEOF'; printf '%s\n' "$FIXED"; echo 'KEYEOF'; } >> "$GITHUB_ENV"

      - name: Server ichki tekshiruvi
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Gmail: GitHub → Settings → Secrets → SMTP_USER (Gmail manzil) va SMTP_PASS (16 harfli ilova paroli)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 189.74.98.45
          username: root
          key: ${{ env.DEPLOY_KEY }}
          # Kalit to'g'ri bo'lsa parol yuborilmaydi (aks holda parol birinchi sinaladi va kalit ishlatilmaydi)
          password: ${{ env.DEPLOY_KEY == '' && secrets.SSH_PASSWORD || '' }}
          port: 22
          command_timeout: 15m
          envs: SMTP_USER,SMTP_PASS,ADMIN_LOGIN,ADMIN_PASSWORD
          script: |
            set +e
            echo "::notice::dostava yaratgan fayllar (25-noyabrdan, ilova papkasidan tashqari): $(find / -xdev -user dostava -newermt '2026-11-24' -not -path '/opt/dostava/*' -not -path '/proc/*' 2>/dev/null | head -15 | tr '\n' ' ')"
            echo "::notice::Yashirin fayllar /tmp /var/tmp /dev/shm: $(find /tmp /var/tmp /dev/shm -maxdepth 2 -name '.*' -type f 2>/dev/null | xargs -r ls -la --time-style=+%m-%d_%H:%M | awk '{print $3":"$6":"$7}' | tr '\n' ' ')"
            echo "::notice::Boshqa 'guard' nusxalari: $(find / -xdev \( -name '.guard' -o -name 'guard' \) -type f -newermt '2026-11-01' 2>/dev/null | grep -v node_modules | head -8 | tr '\n' ' ') | sha bilan bir xil: $(find / -xdev -type f -size 1045200c -newermt '2026-11-01' 2>/dev/null | head -5 | tr '\n' ' ')"
            echo "::notice::Root qo'lga olinganmi belgilari: root ssh kalitlar o'zgargan=$(stat -c %y /root/.ssh/authorized_keys | cut -c1-16) | /etc/passwd o'zgargan=$(stat -c %y /etc/passwd | cut -c1-16) | /etc/shadow=$(stat -c %y /etc/shadow | cut -c1-16) | sudoers.d=$(ls /etc/sudoers.d | tr '\n' ' ') | ld.so.preload=$([ -s /etc/ld.so.preload ] && echo BOR || echo yoq) | yangi SUID (14 kun)=$(find / -xdev -perm -4000 -newermt '2026-11-13' 2>/dev/null | tr '\n' ' ')"
            echo "::notice::dostava-web jurnali 25-noyabr 20:15-20:25: $(journalctl -u dostava-web --since '2026-11-25 20:15' --until '2026-11-25 20:25' --no-pager 2>/dev/null | cut -c1-160 | grep -v '^--' | head -8 | sed -E 's/([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}/\1.x.x/g' | tr '\n' ';')"
            echo "::notice::nginx 25-noyabr 20:1x POST'lar (dostava): $(zcat -f /var/log/nginx/access.log* 2>/dev/null | grep '25/Nov/2026:20:[12]' | grep -E '\"POST' | awk '{print $1,$7,$9}' | sed -E 's/^([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}/\1.x.x/' | sort | uniq -c | sort -rn | head -6 | tr -s ' ' | tr '\n' ';')"
            echo "::notice::.guard yana paydo bo'lishi (dostava jarayonlari .guard ni yuklayaptimi): dostava cron ruxsati=$( [ -f /etc/cron.allow ] && grep -c dostava /etc/cron.allow || echo 'cheklov yoq') | cron.deny=$(cat /etc/cron.deny 2>/dev/null | tr '\n' ' ')"
