name: ZIP ni qo'llash
on:
  push:
    branches: [main]
    paths: ['Hemu.uz-yangilangan.zip', '.github/workflows/apply-zip.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          ZIP="Hemu.uz-yangilangan.zip"
          [ -f "$ZIP" ] || { echo "ZIP yo'q"; exit 0; }
          TMP="$(mktemp -d)"; unzip -q "$ZIP" -d "$TMP"
          rsync -a --exclude .git --exclude .github --exclude '*.zip' "$TMP/Hemu.uz/" ./
          git rm -q "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rasmlarni WebP ga siqish va ro'yxatdan o'tishda email (Gmail) orqali kod" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push
