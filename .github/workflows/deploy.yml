# Har bir push'dan keyin saytni serverda avtomatik yangilaydi.
# Bir marta sozlash: GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Nomi: SSH_PASSWORD   Qiymati: serverning root paroli
name: Serverga yuklash

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Serverda yangilash
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 189.74.98.45
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            # SSH blokini olib tashlash (ko'p xato urinishdan keyin)
            fail2ban-client unban --all >/dev/null 2>&1 || true
            # Zaxira nusxa (oxirgi 5 tasi saqlanadi)
            mkdir -p /root/hemu-backups
            tar czf /root/hemu-backups/hemu-$(date +%F-%H%M).tgz --exclude=node_modules -C /opt hemu
            ls -1t /root/hemu-backups/*.tgz | tail -n +6 | xargs -r rm -f
            # Yangi kod (baza `data/` va `.env` ga tegilmaydi)
            U=$(stat -c %U /opt/hemu/package.json)
            rm -rf /tmp/hemu-new
            git clone -q --depth 1 https://github.com/imyakuboff/Hemu.uz /tmp/hemu-new
            git -C /tmp/hemu-new rev-parse HEAD > /tmp/hemu-new/.deployed
            rm -rf /tmp/hemu-new/.git /tmp/hemu-new/.github
            chown -R "$U": /tmp/hemu-new
            sudo -u "$U" cp -r /tmp/hemu-new/. /opt/hemu/
            cd /opt/hemu
            sudo -u "$U" npm install --omit=dev --no-audit --no-fund --cache /tmp/hemu-npm
            systemctl restart hemu
            sleep 4
            systemctl is-active hemu
            curl -fsS http://127.0.0.1:4700/health
            echo
            sudo -u "$U" node -e "require('sharp');console.log('sharp OK')" || echo "sharp yo'q (rasmlar siqilmaydi)"
            echo "Yangilandi: $(cat .deployed)"
